# Testy prototypu przy każdym wypchnięciu: crawler, przebiegi spraw, offline, axe, Lighthouse, czytelność, intencje.
name: Testy
on:
  push:
  pull_request:
jobs:
  testy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm i --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: npm test
        run: |
          export CHROME_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())")
          npm test
      - run: node tests/sprawdz-zgloszenie.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wyniki-testow
          path: tests/out/
